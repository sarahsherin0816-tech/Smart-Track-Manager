<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>
</head>

<body>
    <!-- header part  -->
    <header class="header">
        <div>
            <h1>Smart Task Manager</h1>
            <p>Organise your work.Stay productive </p>
        </div>
        <button id="themebtn" class="theme-btn">🌙</button>
    </header>
    <!-- main section -->
    <main class="container">
        <!-- sction 1 dashboard -->
        <section class="dashboard">
            <div class="stat-card">
                <span class="stat-title">Total tasks</span>
                <strong id="totaltasks">0</strong>
            </div>
            <div class="stat-card">
                <span class="stat-title">Pending</span>
                <strong id="pendingtasks">0</strong>
            </div>
            <div class="stat-card">
                <span class="stat-title">Completed</span>
                <strong id="Completedtasks">0</strong>
            </div>
            <div class="stat-card">
                <span class="stat-title">Progress</span>
                <strong id="progesstasks">0%</strong>
            </div>
        </section>
        <!-- section 2 form section  -->
        <section class="task-form-section">
            <h2>Add New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="taskTitle">Task Title :</label>
                    <input type="text" id="taskTitle" placeholder="Enter your task" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description </label>
                    <textarea id="taskDescription" placeholder="Enter task description....."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority">
                            <option value="low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">

                            <option value="Study">
                                Study
                            </option>

                            <option value="Work">
                                Work
                            </option>

                            <option value="Personal">
                                Personal
                            </option>

                            <option value="Project">
                                Project
                            </option>

                        </select>
                    </div>
                    <div class="form-group">
                        <label for="duedate">Due Date</label>
                        <input type="date" id="duedate">
                    </div>
                </div>
                <button type="submit" class="add-btn">+ Add task</button>

            </form>

        </section>
        <!-- section 3 task controls -->
        <section class="task-controls">
            <input type="search" id="seachInput" placeholder="🔍 Search tasks...">
            <select id="filterStatus">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="Completed">Completed</option>
            </select>

            <select id="filterPriority">

                <option value="all">
                    All Priorities
                </option>

                <option value="High">
                    High
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Low">
                    Low
                </option>

            </select>
        </section>
        <!--  section 4 task list  -->
        <div class="seaction-header">
            <h2>My tasks</h2>
            <button id="clearCompleted">clear completed</button>

        </div>

        <!-- JavaScript will add tasks here -->

        </div>


        <p id="emptyMessage" class="empty-message">
            No tasks found.
        </p>

        </section>


    </main>

    <footer class="footer">
        <p>Smart Task Manager • Built with HTML, CSS & JavaScript</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
